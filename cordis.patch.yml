# Native DeepSeek Harness (DSH) bundle patch for codex-bridge.
# Mounts 6 tools as mcp__codex-bridge__<tool> via @deepseek-ai/dsh-mcp-client
# and bundles the codex-delegate skill via @deepseek-ai/dsh-skill-filesystem.
# Optional override: set CODEX_BRIDGE_PYTHON in DSH environment to pin a specific Python interpreter.
- insert:
    - id: codex-bridge-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js >
        typeof ctx !== "undefined"
        && typeof ctx?.loader?.entries === "function"
        && [...ctx.loader.entries()].some((e) =>
          e?.options?.name === "@deepseek-ai/dsh-mcp-client"
          && e?.options?.id !== "codex-bridge-mcp"
          && e?.options?.config?.serverName === "codex-bridge"
          && !e?.disabled
        )
      config:
        serverName: codex-bridge
        transport: stdio
        command: !!js >
          (() => {
            const fs = process.getBuiltinModule("node:fs");
            const path = process.getBuiltinModule("node:path");
            const { execFileSync } = process.getBuiltinModule("node:child_process");
            const le = (() => {
              try {
                return typeof ctx !== "undefined" && typeof ctx?.get === "function"
                  ? ctx.get("launchEnvironment")
                  : null;
              } catch {
                return null;
              }
            })();
            const isPy310 = (bin) => {
              try {
                execFileSync(
                  bin,
                  ["-c", "import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)"],
                  { stdio: "ignore", timeout: 5000 },
                );
                return true;
              } catch {
                return false;
              }
            };
            const rawEnvPy = le
              ? le.getFrom("CODEX_BRIDGE_PYTHON", ["process", "user-env"])?.value
              : process.env.CODEX_BRIDGE_PYTHON;
            const envPy = typeof rawEnvPy === "string" ? rawEnvPy.trim() : "";
            if (envPy) {
              if (!isPy310(envPy)) {
                throw new Error(`CODEX_BRIDGE_PYTHON (${envPy}) is unavailable or older than Python 3.10.`);
              }
              return envPy;
            }
            if (process.platform === "win32") {
              for (const query of ["python", "python3", "py"]) {
                let lines = [];
                try {
                  lines = execFileSync("where.exe", [query], {
                    encoding: "utf8",
                    stdio: ["ignore", "pipe", "ignore"],
                    timeout: 5000,
                  }).split(/\r?\n/);
                } catch {
                  continue;
                }
                for (const rawLine of lines) {
                  const p = rawLine.trim();
                  if (!p || /WindowsApps\\python[^\\]*\.exe$/i.test(p) || !fs.existsSync(p)) continue;
                  if (/\\py\.exe$/i.test(p)) {
                    try {
                      const exe = execFileSync(
                        p,
                        ["-3", "-c", "import sys; print(sys.executable) if sys.version_info >= (3, 10) else sys.exit(1)"],
                        { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"], timeout: 5000 },
                      ).trim().split(/\r?\n/)[0];
                      if (exe && fs.existsSync(exe) && isPy310(exe)) return exe;
                    } catch {}
                    continue;
                  }
                  if (isPy310(p)) return p;
                }
              }
              throw new Error(
                "codex-bridge requires Python 3.10+. Install Python 3.10+ or set CODEX_BRIDGE_PYTHON in your user/process environment.",
              );
            }
            const candidates = [];
            for (const dir of (process.env.PATH || "").split(path.delimiter).filter(Boolean)) {
              candidates.push(path.join(dir, "python3"), path.join(dir, "python"));
            }
            candidates.push("/opt/homebrew/bin/python3", "/usr/local/bin/python3", "/usr/bin/python3");
            for (const cand of new Set(candidates)) {
              if (fs.existsSync(cand) && isPy310(cand)) return cand;
            }
            throw new Error(
              "codex-bridge requires Python 3.10+. Install Python 3.10+ or set CODEX_BRIDGE_PYTHON in your user/process environment.",
            );
          })()
        env: !!js >
          (() => {
            const le = (() => {
              try {
                return typeof ctx !== "undefined" && typeof ctx?.get === "function"
                  ? ctx.get("launchEnvironment")
                  : null;
              } catch {
                return null;
              }
            })();
            if (!le) return {};
            const trusted = le.getFrom("CODEX_BIN", ["process", "user-env"])?.value;
            const anyVal = le.get("CODEX_BIN")?.value;
            if (!trusted && anyVal) return { CODEX_BIN: "" };
            return {};
          })()
        args: !!js >
          (() => {
            const fs = process.getBuiltinModule("node:fs");
            const path = process.getBuiltinModule("node:path");
            const { createRequire } = process.getBuiltinModule("node:module");
            const isValidRoot = (dir) => {
              if (!dir) return false;
              try {
                const pkg = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                return pkg?.name === "codex-bridge"
                  && fs.existsSync(path.join(dir, "server", "codex_mcp_server.py"))
                  && fs.existsSync(path.join(dir, "skills", "codex-delegate", "SKILL.md"));
              } catch {
                return false;
              }
            };
            const profileDir = (() => {
              try {
                return typeof ctx !== "undefined" && typeof ctx?.get === "function"
                  ? ctx.get("profileContext")?.dir
                  : null;
              } catch {
                return null;
              }
            })();
            for (const base of [profileDir, process.cwd()].filter(Boolean)) {
              try {
                const req = createRequire(path.join(base, "package.json"));
                const dir = path.dirname(req.resolve("codex-bridge/package.json"));
                if (isValidRoot(dir)) return ["-u", path.join(dir, "server", "codex_mcp_server.py")];
              } catch {}
            }
            if (isValidRoot(process.cwd())) {
              return ["-u", path.join(process.cwd(), "server", "codex_mcp_server.py")];
            }
            throw new Error("Unable to locate verified codex-bridge package root for MCP server.");
          })()
        cwd: !!js >
          (() => {
            const fs = process.getBuiltinModule("node:fs");
            const path = process.getBuiltinModule("node:path");
            const { createRequire } = process.getBuiltinModule("node:module");
            const isValidRoot = (dir) => {
              if (!dir) return false;
              try {
                const pkg = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                return pkg?.name === "codex-bridge"
                  && fs.existsSync(path.join(dir, "server", "codex_mcp_server.py"))
                  && fs.existsSync(path.join(dir, "skills", "codex-delegate", "SKILL.md"));
              } catch {
                return false;
              }
            };
            const profileDir = (() => {
              try {
                return typeof ctx !== "undefined" && typeof ctx?.get === "function"
                  ? ctx.get("profileContext")?.dir
                  : null;
              } catch {
                return null;
              }
            })();
            for (const base of [profileDir, process.cwd()].filter(Boolean)) {
              try {
                const req = createRequire(path.join(base, "package.json"));
                const dir = path.dirname(req.resolve("codex-bridge/package.json"));
                if (isValidRoot(dir)) return dir;
              } catch {}
            }
            if (isValidRoot(process.cwd())) return process.cwd();
            throw new Error("Unable to locate verified codex-bridge package root.");
          })()
        toolCallTimeoutMs: 1800000
        failOnStartupError: true
    - id: codex-bridge-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: !!js >
        typeof ctx !== "undefined"
        && typeof ctx?.loader?.entries === "function"
        && [...ctx.loader.entries()].some((e) =>
          e?.options?.name === "@deepseek-ai/dsh-skill-filesystem"
          && e?.options?.id !== "codex-bridge-skills"
          && e?.options?.config?.providerName === "codex-bridge"
          && !e?.disabled
        )
      config:
        providerName: codex-bridge
        includeDefaultRoots: false
        bundledSkillDir: !!js >
          (() => {
            const fs = process.getBuiltinModule("node:fs");
            const path = process.getBuiltinModule("node:path");
            const { createRequire } = process.getBuiltinModule("node:module");
            const isValidRoot = (dir) => {
              if (!dir) return false;
              try {
                const pkg = JSON.parse(fs.readFileSync(path.join(dir, "package.json"), "utf8"));
                return pkg?.name === "codex-bridge"
                  && fs.existsSync(path.join(dir, "server", "codex_mcp_server.py"))
                  && fs.existsSync(path.join(dir, "skills", "codex-delegate", "SKILL.md"));
              } catch {
                return false;
              }
            };
            const profileDir = (() => {
              try {
                return typeof ctx !== "undefined" && typeof ctx?.get === "function"
                  ? ctx.get("profileContext")?.dir
                  : null;
              } catch {
                return null;
              }
            })();
            for (const base of [profileDir, process.cwd()].filter(Boolean)) {
              try {
                const req = createRequire(path.join(base, "package.json"));
                const dir = path.dirname(req.resolve("codex-bridge/package.json"));
                if (isValidRoot(dir)) return path.join(dir, "skills");
              } catch {}
            }
            if (isValidRoot(process.cwd())) return path.join(process.cwd(), "skills");
            throw new Error("Unable to locate verified codex-bridge package root for bundled skills.");
          })()
